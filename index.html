      <nav class="tabs" aria-label="主导航">
        <a href="#train" data-view="train" title="训练"><svg class="i" aria-hidden="true"><use href="#i-brain"></use></svg><span>训练</span></a>
        <a href="#vocab" data-view="vocab" title="词汇"><svg class="i" aria-hidden="true"><use href="#i-book-a"></use></svg><span>词汇</span><b id="vocab-badge" class="badge" hidden>0</b></a>
        <a href="#listening" data-view="listening" title="听力"><svg class="i" aria-hidden="true"><use href="#i-headphones"></use></svg><span>听力</span></a>
        <a href="#reading" data-view="reading" title="阅读"><svg class="i" aria-hidden="true"><use href="#i-book-open-text"></use></svg><span>阅读</span></a>
        <a href="#writing" data-view="writing" title="写作"><svg class="i" aria-hidden="true"><use href="#i-pen-line"></use></svg><span>写作</span></a>
        <a href="#speaking" data-view="speaking" title="口语"><svg class="i" aria-hidden="true"><use href="#i-mic"></use></svg><span>口语</span></a>
        <a href="#resources" data-view="resources" title="资源"><svg class="i" aria-hidden="true"><use href="#i-library"></use></svg><span>资源</span></a>
      </nav>
      <button id="open-settings" class="icon-btn" type="button" title="设置" aria-label="设置"><svg class="i" aria-hidden="true"><use href="#i-settings"></use></svg></button>
    </div>
    <nav class="subtabs" aria-label="词汇" hidden>
      <div class="subtabs-inner">
        <a href="#practice" data-view="practice"><svg class="i" aria-hidden="true"><use href="#i-list-checks"></use></svg><span>自测</span></a>
        <a href="#list" data-view="list"><svg class="i" aria-hidden="true"><use href="#i-list"></use></svg><span>词表</span></a>
        <a href="#wrong" data-view="wrong"><svg class="i" aria-hidden="true"><use href="#i-book-x"></use></svg><span>错词本</span><b id="wrong-badge" class="badge" hidden>0</b></a>
        <a href="#stats" data-view="stats"><svg class="i" aria-hidden="true"><use href="#i-chart-column"></use></svg><span>统计</span></a>
      </div>
    </nav>
  </header>

  <main>
    <section id="view-train" class="view" aria-label="训练"></section>
    <section id="view-practice" class="view" aria-label="自测" hidden></section>
    <section id="view-list" class="view" aria-label="词表" hidden></section>
    <section id="view-wrong" class="view" aria-label="错词本" hidden></section>
    <section id="view-stats" class="view" aria-label="统计" hidden></section>
    <section id="view-listening" class="view" aria-label="听力" hidden></section>
    <section id="view-reading" class="view" aria-label="阅读" hidden></section>
    <section id="view-writing" class="view" aria-label="写作" hidden></section>
    <section id="view-speaking" class="view" aria-label="口语" hidden></section>
    <section id="view-resources" class="view" aria-label="资源" hidden></section>
  </main>

  <div id="settings" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title">设置</h2>
        <button type="button" class="icon-btn" data-act="close" title="关闭" aria-label="关闭"><svg class="i" aria-hidden="true"><use href="#i-x"></use></svg></button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
